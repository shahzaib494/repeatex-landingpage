kind = "web"
previewPath = "/"
title = "RepeatEx Landing Page"
version = "1.0.0"
id = "artifacts/repeatex"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23516

[services.development]
run = "pnpm --filter @workspace/repeatex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/repeatex", "run", "build" ]
publicDir = "artifacts/repeatex/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23516"
BASE_PATH = "/"
